map $http_accept $preferred_ext {
    default                                .html;
    "~*^(?:(?!text/html).)*text/markdown"  .md;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip_static on;
    brotli_static on;

    error_page 404 /404.html;

    location = / {
        try_files /index.html =404;
    }

    # Extensionless slug: redirect to .html or .md based on Accept header.
    # Excludes paths that already contain a dot (extensions) or end in slash.
    location ~ ^/[^.]*[^./]$ {
        return 302 $uri$preferred_ext;
    }

    location ~ \.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
