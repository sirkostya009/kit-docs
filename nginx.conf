map $http_accept $preferred_ext {
    default                                .html;
    "~*^(?:(?!text/html).)*text/markdown"  .md;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip_static on;
    brotli_static on;

    error_page 404 /404.html;

    # 404 responses must not be cached — protects against transient missing
    # bundles during rolling deploys getting pinned in shared caches.
    # internal: only reachable via error_page redirect, not directly.
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    location = / {
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400" always;
        try_files /index.html =404;
    }

    # Hashed bundles — content-addressed, safe to cache forever.
    location ^~ /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SvelteKit polls version.json to detect new deploys; env.js holds runtime env.
    location = /_app/version.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /_app/env.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Generated indexes — regenerated each build; same lifecycle as html.
    location = /llms.txt {
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # Extensionless slug: redirect to .html or .md based on Accept header.
    # Vary: Accept prevents shared caches from serving the wrong target.
    # Underscore-prefixed paths (e.g. /_sitemap) are .md-only — no .html exists.
    location ~ ^/(?!_)[^.]*[^./]$ {
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept" always;
        return 302 $uri$preferred_ext;
    }

    location ~ \.md$ {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # Pages, SvelteKit data files, search index.
    location ~ \.(html|json)$ {
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # Static assets (favicon, robots, sitemap).
    location ~ \.(svg|ico|png|jpg|jpeg|webp|woff2?|xml|txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
